<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tennis Schedule Manager</title>
  <style>
    :root{--green:#16a34a;--blue:#2563eb;--red:#dc2626;--purple:#7c3aed;--gray:#e5e7eb;--dark:#111827;--ink:#111827;--muted:#64748b}
    *{box-sizing:border-box}body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#f8fafc;color:var(--ink)}h1{margin:0 0 16px}
    button{border:0;background:#2563eb;color:#fff;padding:9px 13px;border-radius:6px;cursor:pointer;font-weight:600}button:hover{filter:brightness(.94)}button:disabled{opacity:.45;cursor:not-allowed}
    input,select{font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:6px}.auth-card,.card{background:#fff;border-radius:9px;box-shadow:0 1px 4px #0002;padding:14px}.auth-card{max-width:470px;margin:0 0 16px}.auth-card input{display:block;width:100%;margin:8px 0}.toolbar,.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.card{min-width:170px}.play-days{display:flex;gap:9px;flex-wrap:wrap;margin-top:7px}.play-days label{white-space:nowrap;font-weight:normal}.identity{color:var(--muted);margin-top:7px}.message{min-height:1.3em;color:#334155;margin-top:8px}.notice{background:#eff6ff;color:#1e3a8a;border-radius:7px;padding:10px 12px;margin:10px 0 14px}.wrap{overflow:auto;background:#fff;border:1px solid #cbd5e1;border-radius:6px}table{border-collapse:collapse;min-width:1150px;width:100%}th,td{border:1px solid #cbd5e1;text-align:center;padding:8px}thead th{position:sticky;top:0;background:var(--dark);color:#fff;z-index:4}.player-col{position:sticky;left:0;z-index:3;background:#fff;min-width:205px;text-align:left}.player-col small{display:block;color:var(--muted);font-weight:normal;font-size:11px;margin-top:3px}.player-head{background:var(--dark);z-index:5}.status{width:50px;min-width:50px;height:37px}.status.editable{cursor:pointer}.status.readonly{color:#475569}.available{background:var(--green);color:white}.sub{background:var(--blue);color:white}.out{background:var(--red);color:white}.booked{background:var(--purple);color:white}.blank{background:var(--gray)}.totals{font-weight:bold;background:#f1f5f9}.small-button{font-size:12px;padding:5px 8px;margin-top:5px}.danger{background:#b91c1c}.manager-button{background:#6d28d9}input[type=file]{display:none}.hint{color:var(--muted);font-size:13px}.top-right{margin-left:auto}
    @media(max-width:600px){body{padding:12px}.toolbar button{flex:1 1 45%}}
  </style>
</head>
<body data-magic-token="<?= magicToken ?>">
  <h1>Tennis Schedule Manager</h1>

  <section class="auth-card" id="signInPanel">
    <b>Player sign in</b>
    <p class="hint">Enter the name and email on the player list. We’ll email you a one-time sign-in link.</p>
    <input id="loginName" autocomplete="name" placeholder="Your name">
    <input id="loginEmail" type="email" autocomplete="email" placeholder="Your email">
    <button id="sendLinkButton" onclick="requestLink()">Email me a sign-in link</button>
    <div class="message" id="authMessage" aria-live="polite"></div>
  </section>

  <div class="toolbar" id="appToolbar" hidden>
    <button id="openScheduleButton" onclick="document.getElementById('scheduleFile').click()">Import Schedule CSV</button>
    <input type="file" id="scheduleFile" accept=".csv" onchange="importSchedule(event)">
    <button onclick="exportSchedule()">Export Schedule CSV</button>
    <button id="playerRosterButton" onclick="document.getElementById('rosterFile').click()">Upload Player List</button>
    <input type="file" id="rosterFile" accept=".csv" onchange="importRoster(event)">
    <button id="addPlayerButton" onclick="addPlayer()">Add Player</button>
    <button id="rollButton" onclick="rollCurrentWeek()">Roll Current Week Forward</button>
    <button class="top-right" onclick="signOut()">Sign Out</button>
  </div>

  <div class="summary" id="appSummary" hidden>
    <div class="card"><b>Signed in as</b><div id="identity" class="identity"></div></div>
    <div class="card"><b>Play Days</b><div id="playDays" class="play-days"></div></div>
  </div>
  <div id="notice" class="notice" hidden></div>
  <p class="hint" id="legend" hidden>Click your row to set A (Available), S (Sub), or / (Out). Only the Schedule Manager can set or clear B (Booked).</p>
  <div class="wrap" id="scheduleWrap" hidden></div>

  <script>
    const MAGIC_TOKEN = document.body.dataset.magicToken || '';
    const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const STATUS_CYCLE = ['', 'A', 'S', '/'];
    let sessionToken = sessionStorage.getItem('tennisSession') || '';
    let appData = null;

    function callServer(name, ...args) {
      return new Promise((resolve, reject) => {
        const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(error => reject(new Error(error && error.message || 'The request failed.')));
        runner[name](...args);
      });
    }
    function isManager() { return !!(appData && appData.user && appData.user.isScheduleManager); }
    function escapeHtml(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    function setMessage(text, isError) { const element=document.getElementById('authMessage');element.textContent=text;element.style.color=isError?'#b91c1c':'#166534'; }
    function showApp(show) {
      document.getElementById('signInPanel').hidden=show;
      document.getElementById('appToolbar').hidden=!show;
      document.getElementById('appSummary').hidden=!show;
      document.getElementById('legend').hidden=!show;
      document.getElementById('scheduleWrap').hidden=!show;
    }
    async function requestLink() {
      const name=document.getElementById('loginName').value.trim();
      const email=document.getElementById('loginEmail').value.trim();
      if(!name||!email){setMessage('Enter your name and email address.',true);return;}
      const button=document.getElementById('sendLinkButton');button.disabled=true;setMessage('Sending…',false);
      try { const message=await callServer('requestMagicLink',name,email);setMessage(message,false); }
      catch(error){setMessage(error.message,true);}
      finally{button.disabled=false;}
    }
    async function start() {
      if(MAGIC_TOKEN){
        try { const result=await callServer('consumeMagicLink',MAGIC_TOKEN);sessionToken=result.token;sessionStorage.setItem('tennisSession',sessionToken);history.replaceState({},document.title,location.pathname); }
        catch(error){sessionStorage.removeItem('tennisSession');sessionToken='';showApp(false);setMessage(error.message,true);return;}
      }
      if(!sessionToken){showApp(false);return;}
      try {
        await callServer('getSession',sessionToken);
        await refreshData();
      } catch(error) {
        sessionStorage.removeItem('tennisSession');sessionToken='';showApp(false);setMessage(error.message+' Request a new sign-in link.',true);
      }
    }
    async function refreshData() {
      appData=await callServer('getAppData',sessionToken);
      showApp(true);
      document.getElementById('identity').textContent=appData.user.name+(isManager()?' · Schedule Manager':'');
      renderControls();renderSchedule();
    }
    function renderControls() {
      const manager=isManager();
      ['openScheduleButton','playerRosterButton','addPlayerButton','rollButton'].forEach(id=>document.getElementById(id).disabled=!manager);
      document.getElementById('playDays').innerHTML=DAY_NAMES.map((day,index)=>`<label><input type="checkbox" value="${index}" ${appData.playDays.includes(index)?'checked':''} ${manager?'':'disabled'} onchange="changePlayDays()"> ${day}</label>`).join('');
      const notice=document.getElementById('notice');notice.hidden=manager;notice.textContent='You can update your own row. Schedule changes and booked status are managed by the Schedule Manager.';
    }
    function renderSchedule() {
      let html='<table><thead><tr><th class="player-col player-head">Player</th>';
      appData.dates.forEach(date=>html+=`<th>${new Date(date+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',month:'numeric',day:'numeric'})}</th>`);
      html+='</tr></thead><tbody>';
      appData.players.forEach(player=>{
        html+='<tr>';
        html+=`<td class="player-col">${escapeHtml(player.name)}${isManager()?`<small>${escapeHtml(player.playerID)} · ${escapeHtml(player.email)}</small><button class="small-button manager-button" data-resend-id="${escapeHtml(player.playerID)}">Resend Link</button><button class="small-button danger" data-remove-id="${escapeHtml(player.playerID)}">Remove</button>`:`<small>${escapeHtml(player.playerID)}</small>`}</td>`;
        appData.dates.forEach(date=>{
          const value=player.availability[date]||'';
          const cls=value==='A'?'available':value==='S'?'sub':value==='/'?'out':value==='B'?'booked':'blank';
          const editable=isManager()||(appData.user.playerID===player.playerID&&value!=='B');
          const action=editable?`data-status-player="${escapeHtml(player.playerID)}" data-status-date="${date}"`:'';
          html+=`<td class="status ${cls} ${editable?'editable':'readonly'}" ${action} aria-label="${escapeHtml(player.name)} ${date}: ${value||'blank'}">${escapeHtml(value)}</td>`;
        });
        html+='</tr>';
      });
      html+=`<tr class="totals"><td class="player-col">Available</td>`;
      appData.dates.forEach(date=>html+=`<td>${appData.players.filter(player=>player.availability[date]==='A').length}</td>`);
      html+='</tr><tr class="totals"><td class="player-col">Subs</td>';
      appData.dates.forEach(date=>html+=`<td>${appData.players.filter(player=>player.availability[date]==='S').length}</td>`);
      html+='</tr></tbody></table>';
      document.getElementById('scheduleWrap').innerHTML=html;
      document.querySelectorAll('[data-status-player]').forEach(cell=>cell.addEventListener('click',()=>changeStatus(cell.dataset.statusPlayer,cell.dataset.statusDate)));
      document.querySelectorAll('[data-resend-id]').forEach(button=>button.addEventListener('click',()=>resendLink(button.dataset.resendId)));
      document.querySelectorAll('[data-remove-id]').forEach(button=>button.addEventListener('click',()=>removePlayer(button.dataset.removeId)));
    }
    async function changeStatus(playerID,date) {
      const player=appData.players.find(item=>item.playerID===playerID);if(!player)return;
      const current=player.availability[date]||'';
      let next;
      if(current==='B')next='';
      else if(current==='/'&&isManager())next='B';
      else if(current==='/')next='';
      else next=STATUS_CYCLE[(STATUS_CYCLE.indexOf(current)+1)%STATUS_CYCLE.length];
      try { await callServer('savePlayerStatus',sessionToken,playerID,date,next);player.availability[date]=next;renderSchedule(); }
      catch(error){alert(error.message);}
    }
    async function changePlayDays() {
      const days=[...document.querySelectorAll('#playDays input:checked')].map(input=>Number(input.value));
      try { appData=await callServer('setPlayDays',sessionToken,days);renderControls();renderSchedule(); }
      catch(error){alert(error.message);renderControls();}
    }
    async function rollCurrentWeek() {
      if(!confirm('Roll the scheduled dates in the current week off the schedule and add the same number of sessions at the end?'))return;
      try { appData=await callServer('rollForwardCurrentWeek',sessionToken);renderControls();renderSchedule(); }
      catch(error){alert(error.message);}
    }
    async function importRoster(event) {
      const file=event.target.files[0];if(!file)return;
      try { const result=await callServer('importPlayerRoster',sessionToken,await file.text());appData=result.data;alert(`Player list uploaded: ${result.added} added, ${result.updated} updated.`);renderControls();renderSchedule(); }
      catch(error){alert(error.message);}
      finally{event.target.value='';}
    }
    async function importSchedule(event) {
      const file=event.target.files[0];if(!file)return;
      try { appData=await callServer('importScheduleCsv',sessionToken,await file.text());alert('Schedule imported.');renderControls();renderSchedule(); }
      catch(error){alert(error.message);}
      finally{event.target.value='';}
    }
    async function addPlayer() {
      const playerID=prompt('PlayerID');if(!playerID)return;
      const name=prompt('Player name');if(!name)return;
      const email=prompt('Player email');if(!email)return;
      try { appData=await callServer('addPlayer',sessionToken,playerID,name,email);renderControls();renderSchedule(); }
      catch(error){alert(error.message);}
    }
    async function removePlayer(playerID) {
      if(!confirm('Remove this player from the active list?'))return;
      try { appData=await callServer('removePlayer',sessionToken,playerID);renderControls();renderSchedule(); }
      catch(error){alert(error.message);}
    }
    async function resendLink(playerID) {
      try { alert(await callServer('resendPlayerLink',sessionToken,playerID)); }
      catch(error){alert(error.message);}
    }
    function exportSchedule() {
      const rows=[['PlayerID',...appData.dates]];
      appData.players.forEach(player=>rows.push([player.playerID,...appData.dates.map(date=>player.availability[date]||'')]));
      const csv=rows.map(row=>row.map(value=>'"'+String(value).replace(/"/g,'""')+'"').join(',')).join('\r\n');
      const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));link.download='tennisSchedule.csv';link.click();URL.revokeObjectURL(link.href);
    }
    async function signOut() {
      try { await callServer('signOut',sessionToken); } catch(error) {}
      sessionStorage.removeItem('tennisSession');sessionToken='';appData=null;showApp(false);setMessage('You are signed out.',false);
    }
    start();
  </script>
</body>
</html>
